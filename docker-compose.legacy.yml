# Meerkat CRM Docker Compose - Separate backend and frontend images (legacy)
#
# Pulls pre-built images from GitHub Container Registry. New installs should use
# docker-compose.yml, which runs the all-in-one image.
#
# USAGE:
#   docker compose -f docker-compose.legacy.yml up -d
#
# To build locally instead, use docker-compose.build.legacy.yml:
#   docker compose -f docker-compose.build.legacy.yml up -d --build

services:
  backend:
    image: ghcr.io/meerkatcrm/meerkat-crm-backend:${IMAGE_TAG:-latest}
    container_name: meerkat-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
    # Set PUID/PGID values through host env variables (.env, not .env.docker) in case required  
      - PUID=${PUID:-1001}
      - PGID=${PGID:-1001}
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      - ${PHOTOS_PATH:-./photos}:/app/static/photos
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/meerkatcrm/meerkat-crm-frontend:${IMAGE_TAG:-latest}
    container_name: meerkat-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-7300}:8080"
    depends_on:
      backend:
        condition: service_healthy
