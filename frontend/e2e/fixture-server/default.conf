server {
    listen 80;
    root /usr/share/nginx/html;

    # Monica's API paths have no extension, and /api/contacts is both a list and
    # a parent of /api/contacts/1/..., so each list is stored as a .json file.
    location / {
        default_type application/json;
        try_files $uri $uri.json =404;
    }
}
