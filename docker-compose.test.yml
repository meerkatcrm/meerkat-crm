# Meerkat CRM Docker Compose - E2E Testing
#
# Builds and runs the all-in-one image for end-to-end testing with Playwright.
# This exercises the same artifact that ships to users (nginx + backend under
# supervisord, same-origin /api). Uses a fresh database for each test run.
#
# USAGE:
#   docker compose -f docker-compose.test.yml up -d --build --wait
#   npx playwright test
#   docker compose -f docker-compose.test.yml down -v

services:
  meerkat:
    image: meerkat-crm-test:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meerkat-test
    environment:
      - SQLITE_DB_PATH=/app/data/test.db
      - JWT_SECRET_KEY=TESThmCqW032YZThAr7NlwUVzgSOSanJdBiaVT0PTfJX7/Rh8OAy
      - ENCRYPTION_KEY=C+6d4A2J1Vq3vtfQkPVPvLp6Ew9gm9Fv4fvXy0bLkxQ=
      - PROFILE_PHOTO_DIR=/app/static/photos
      - FRONTEND_URL=http://localhost:7300
      - DISABLE_REGISTRATION=false
      - CARDDAV_ENABLED=true
      # The whole suite shares one client IP, so the default limits would trip
      - AUTH_RATE_LIMIT_BURST=100000
      - API_RATE_LIMIT_BURST=100000
      # Password reset mail goes to Mailpit, where the E2E suite reads the token
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM_EMAIL=meerkat@example.com
    volumes:
      - test-data:/app/data
      - test-photos:/app/static/photos
    ports:
      # Frontend and same-origin /api are both served by nginx on 8080
      - "7300:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: meerkat-test-mailpit
    ports:
      - "8025:8025"

  # Static stand-in for remote servers: an .ics feed and a Monica API. The app
  # reaches it at http://fixtures/, which the E2E suite types into its forms.
  fixtures:
    image: nginx:1.29-alpine
    container_name: meerkat-test-fixtures
    volumes:
      - ./frontend/e2e/fixture-server/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/e2e/fixture-server/www:/usr/share/nginx/html:ro

volumes:
  test-data:
  test-photos:
